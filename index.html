<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUNDIAL 2026 - Panini Checklist</title>
    
    <!-- Librerías de Animación -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>

    <style>
        :root {
            --usa-blue: #002868;
            --mex-green: #006341; /* Verde más profundo y vibrante */
            --can-red: #EF3340;
            --fifa-gold: #d4af37;
            --glass: rgba(255, 255, 255, 0.82);
            --have-bg: #dcfce7;
            --have-border: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        /* Contenedor del fondo animado */
        #vanta-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }

        /* Capa Bandera Tricolor con VERDE REFORZADO */
        .flag-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, 
                rgba(0, 40, 104, 0.35) 0%, 
                rgba(0, 99, 65, 0.6) 45%,  /* Verde más opaco y centrado */
                rgba(0, 99, 65, 0.6) 55%, 
                rgba(239, 51, 64, 0.35) 100%);
            z-index: -1; pointer-events: none;
        }

        body { color: #1a202c; min-height: 100vh; overflow-x: hidden; }

        /* Login Estilo Píldora */
        .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card {
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 50px 40px; border-radius: 50px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.4);
        }
        .login-card h2 { color: var(--usa-blue); font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; letter-spacing: -1px; }
        .login-card input { 
            width: 100%; padding: 15px 25px; margin-bottom: 15px; 
            border: 1px solid rgba(0,0,0,0.1); border-radius: 30px; outline: none; font-size: 1rem;
        }
        .login-card button { 
            width: 100%; padding: 15px; background: var(--usa-blue); color: white;
            border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
            transition: 0.4s; font-size: 1.1rem;
        }
        .login-card button:hover { background: var(--mex-green); transform: scale(1.03); }

        /* Layout Principal */
        .app-container { display: none; padding: 25px; max-width: 1200px; margin: 0 auto; }
        
        header { 
            background: var(--glass); backdrop-filter: blur(15px);
            padding: 20px 40px; border-radius: 100px; margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid white;
        }

        .dashboard { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; margin-bottom: 30px; 
        }
        .kpi { 
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 35px; text-align: center; border: 1px solid white;
        }
        .kpi span { display: block; font-size: 1.8rem; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .kpi label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #555; letter-spacing: 1px; }

        /* Buscador */
        .search-box {
            background: var(--glass); padding: 20px 30px; border-radius: 40px; margin-bottom: 30px;
            display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; border: 1px solid white;
        }
        .search-box input, .search-box select { 
            padding: 12px 20px; border-radius: 25px; border: 1px solid rgba(0,0,0,0.08); outline: none; font-weight: 600;
        }

        /* Grid de Estampas */
        .items-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); 
            gap: 15px; 
        }
        .sticker-card { 
            background: white; border-radius: 30px; padding: 22px 10px;
            text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); position: relative; border: 2px solid transparent;
        }
        .sticker-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }

        /* Estampas Marcadas con Palomita (Checkmark) */
        .sticker-card.status-si { 
            background: var(--have-bg); 
            border-color: var(--have-border); 
        }
        .sticker-card.status-si::before {
            content: '✓';
            position: absolute; top: 10px; left: 15px;
            background: var(--have-border); color: white;
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: bold;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .s-id { font-weight: 900; font-size: 1.4rem; color: var(--usa-blue); position: relative; z-index: 1; }
        .s-desc { font-size: 0.7rem; color: #4a5568; margin-top: 5px; font-weight: 800; text-transform: uppercase; }
        .s-group { font-size: 0.6rem; color: #888; margin-top: 3px; font-weight: 700; }

        .badge {
            position: absolute; top: -5px; right: -5px; background: var(--fifa-gold);
            color: white; font-size: 0.65rem; padding: 5px 12px; border-radius: 20px;
            font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 3;
        }

        @media (max-width: 600px) {
            .search-box { grid-template-columns: 1fr; border-radius: 30px; }
            .items-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            header { padding: 15px 25px; border-radius: 30px; flex-direction: column; gap: 8px; text-align: center; }
            .dashboard { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div id="vanta-canvas"></div>
    <div class="flag-overlay"></div>

    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h2>MUNDIAL 2026</h2>
            <p style="color:#666; font-weight:700; text-transform: uppercase; letter-spacing: 1px;">Mi Álbum Virtual</p><br>
            <input type="text" id="usernameField" placeholder="Usuario">
            <input type="password" id="passwordField" placeholder="Contraseña">
            <button onclick="loginUser()">INGRESAR AL ÁLBUM</button>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <header>
            <div>
                <h1 style="color: var(--usa-blue); font-weight: 900;">🏆 MUNDIAL 2026</h1>
                <small id="userDisplay" style="color: var(--mex-green); font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px;"></small>
            </div>
            <button onclick="location.reload()" style="background: var(--can-red); color: white; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; font-weight: 800; transition: 0.3s; box-shadow: 0 4px 10px rgba(239, 51, 64, 0.3);">SALIR</button>
        </header>

        <div class="dashboard">
            <div class="kpi"><span id="kpiTotal" style="color: var(--usa-blue);">0</span><label>Total</label></div>
            <div class="kpi"><span id="kpiTengo" style="color: var(--mex-green);">0</span><label>Tengo</label></div>
            <div class="kpi"><span id="kpiFaltan" style="color: var(--can-red);">0</span><label>Faltan</label></div>
            <div class="kpi"><span id="kpiProgreso" style="color: var(--fifa-gold);">0.00%</span><label>Logro</label></div>
        </div>

        <div class="search-box">
            <input type="text" id="searchBar" placeholder="🔍 Buscar por código o país..." oninput="renderGrid()">
            <select id="groupFilter" onchange="renderGrid()">
                <option value="ALL">📍 Todas las Secciones</option>
            </select>
            <select id="statusFilter" onchange="renderGrid()">
                <option value="ALL">📊 Ver Todos</option>
                <option value="SI">✅ Ya los tengo</option>
                <option value="NO">❌ Me faltan</option>
            </select>
        </div>

        <div class="items-grid" id="stickersGrid"></div>
    </div>

    <script>
        // Fondo VANTA WAVES con efecto de ondulación de bandera reforzado
        VANTA.WAVES({
            el: "#vanta-canvas",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x051a30, // Azul base oscuro
            shininess: 45.00, // Más brillo para notar las ondas
            waveHeight: 20.00, // Regresamos la ondulación alta
            waveSpeed: 0.85,  // Velocidad moderada para que se note el movimiento
            zoom: 0.95        // Zoom un poco más abierto para ver la forma de la onda
        });

        const LISTA_PAISES = [
            { n: "Canadá", c: "CAN" }, { n: "Estados Unidos", c: "USA" }, { n: "México", c: "MEX" },
            { n: "Argentina", c: "ARG" }, { n: "Brasil", c: "BRA" }, { n: "Colombia", c: "COL" },
            { n: "Ecuador", c: "ECU" }, { n: "Paraguay", c: "PAR" }, { n: "Uruguay", c: "URU" },
            { n: "Alemania", c: "GER" }, { n: "Austria", c: "AUT" }, { n: "Bélgica", c: "BEL" },
            { n: "Bosnia y Herzegovina", c: "BIH" }, { n: "Croacia", c: "CRO" }, { n: "Escocia", c: "SCO" },
            { n: "España", c: "ESP" }, { n: "Francia", c: "FRA" }, { n: "Inglaterra", c: "ENG" },
            { n: "Noruega", c: "NOR" }, { n: "Países Bajos", c: "NED" }, { n: "Portugal", c: "POR" },
            { n: "República Checa", c: "CZE" }, { n: "Suecia", c: "SWE" }, { n: "Suiza", c: "SUI" },
            { n: "Turquía", c: "TUR" }, { n: "Curazao", c: "CUW" }, { n: "Haití", c: "HAI" },
            { n: "Panamá", c: "PAN" }, { n: "Argelia", c: "ALG" }, { n: "Cabo Verde", c: "CPV" },
            { n: "Costa de Marfil", c: "CIV" }, { n: "Egipto", c: "EGY" }, { n: "Ghana", c: "GHA" },
            { n: "Marruecos", c: "MAR" }, { n: "Senegal", c: "SEN" }, { n: "Sudáfrica", c: "RSA" },
            { n: "Túnez", c: "TUN" }, { n: "Arabia Saudita", c: "KSA" }, { n: "Australia", c: "AUS" },
            { n: "Corea del Sur", c: "KOR" }, { n: "Emiratos Árabes", c: "UAE" }, { n: "Irán", c: "IRN" },
            { n: "Japón", c: "JPN" }, { n: "Jordania", c: "JOR" }, { n: "Uzbekistán", c: "UZB" },
            { n: "Nueva Zelanda", c: "NZL" }, { n: "Venezuela", c: "VEN" }, { n: "Irak", c: "IRQ" }
        ].sort((a, b) => a.n.localeCompare(b.n));

        const STICKERS_BASE = [];
        for (let i = 0; i <= 19; i++) {
            let label = i === 0 ? "00" : i;
            STICKERS_BASE.push({ id: `FWC ${label}`, desc: (i==0||i==19)?"Especial":"FIFA", grupo: "FWC" });
        }
        LISTA_PAISES.forEach(p => {
            for (let i = 1; i <= 20; i++) {
                let d = `Jugador ${i}`; let tag = "";
                if(i === 1) { d = "Escudo"; tag = "ESC"; }
                if(i === 13) { d = "Equipo"; tag = "SQD"; }
                STICKERS_BASE.push({ id: `${p.c} ${i}`, desc: d, grupo: p.n, tag: tag });
            }
        });
        for (let i = 1; i <= 14; i++) {
            STICKERS_BASE.push({ id: `CC ${i}`, desc: "Coca-Cola", grupo: "COCA-COLA" });
        }

        let userProgress = JSON.parse(localStorage.getItem("panini_v5_save")) || {};
        let currentUser = null;

        function loginUser() {
            const u = document.getElementById("usernameField").value.trim().toUpperCase();
            if(!u) return alert("Por favor ingresa un nombre de usuario.");
            currentUser = u;
            if(!userProgress[currentUser]) userProgress[currentUser] = {};
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("appContainer").style.display = "block";
            document.getElementById("userDisplay").textContent = "Hola, " + currentUser;
            poblarFiltroGrupos();
            renderGrid();
        }

        function poblarFiltroGrupos() {
            const select = document.getElementById("groupFilter");
            const grupos = [...new Set(STICKERS_BASE.map(s => s.grupo))];
            grupos.forEach(g => {
                const opt = document.createElement("option");
                opt.value = g; opt.textContent = g;
                select.appendChild(opt);
            });
        }

        function toggleSticker(id, element) {
            const actual = userProgress[currentUser][id] || "NO";
            const nuevo = actual === "SI" ? "NO" : "SI";
            userProgress[currentUser][id] = nuevo;
            
            if (nuevo === "SI") element.classList.add("status-si");
            else element.classList.remove("status-si");

            localStorage.setItem("panini_v5_save", JSON.stringify(userProgress));
            actualizarKPIs();
        }

        function actualizarKPIs() {
            const total = STICKERS_BASE.length;
            let tengo = 0;
            STICKERS_BASE.forEach(s => { if(userProgress[currentUser][s.id] === "SI") tengo++; });
            
            document.getElementById("kpiTotal").textContent = total;
            document.getElementById("kpiTengo").textContent = tengo;
            document.getElementById("kpiFaltan").textContent = total - tengo;
            
            // PORCENTAJE CON 2 DECIMALES
            const porcentaje = ((tengo / total) * 100).toFixed(2);
            document.getElementById("kpiProgreso").textContent = porcentaje + "%";
        }

        function renderGrid() {
            const grid = document.getElementById("stickersGrid");
            const busqueda = document.getElementById("searchBar").value.toLowerCase();
            const fG = document.getElementById("groupFilter").value;
            const fS = document.getElementById("statusFilter").value;
            grid.innerHTML = "";
            const frag = document.createDocumentFragment();

            STICKERS_BASE.forEach(s => {
                const status = userProgress[currentUser][s.id] || "NO";
                if(fG !== "ALL" && s.grupo !== fG) return;
                if(fS !== "ALL" && status !== fS) return;
                if(busqueda && !s.id.toLowerCase().includes(busqueda) && !s.grupo.toLowerCase().includes(busqueda)) return;

                const card = document.createElement("div");
                card.className = `sticker-card ${status === 'SI' ? 'status-si' : ''}`;
                card.onclick = () => toggleSticker(s.id, card);
                card.innerHTML = `${s.tag ? `<div class="badge">${s.tag}</div>` : ""}
                    <div class="s-id">${s.id}</div>
                    <div class="s-desc">${s.desc}</div>
                    <div class="s-group">${s.grupo}</div>`;
                frag.appendChild(card);
            });
            grid.appendChild(frag);
            actualizarKPIs();
        }
    </script>
</body>
</html>
