<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Panini Mundial 2026</title>
    <style>
        :root {
            --fifa-maroon: #8a1538;
            --fifa-gold: #b39453;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2d3748;
            --have-bg: #c6f6d5;
            --have-text: #22543d;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; }

        /* Login Screen */
        .login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--fifa-maroon), #5a0d24);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .login-card {
            background: white; padding: 35px; border-radius: 15px; width: 90%; max-width: 380px;
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .login-card h2 { color: var(--fifa-maroon); margin-bottom: 25px; font-size: 1.8rem; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; }
        .login-card button { 
            width: 100%; padding: 12px; background: var(--fifa-maroon); color: white; 
            border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem;
            transition: background 0.3s;
        }
        .login-card button:hover { background: #6b102b; }

        /* App Layout */
        .app-container { display: none; max-width: 1100px; margin: 0 auto; padding: 10px; }
        
        header { 
            background: var(--fifa-maroon); color: white; padding: 20px; border-radius: 12px; 
            margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 1.4rem; letter-spacing: 1px; }

        .dashboard { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 10px; margin-bottom: 15px; 
        }
        .kpi { background: white; padding: 12px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--fifa-gold); }
        .kpi span { display: block; font-size: 1.4rem; font-weight: bold; color: var(--fifa-maroon); }
        .kpi label { font-size: 0.7rem; color: #718096; text-transform: uppercase; font-weight: bold; }

        /* Search & Filters */
        .search-box {
            background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px;
            display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; border: 1px solid var(--border);
        }
        .search-box input, .search-box select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }

        /* Grid */
        .items-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
            gap: 10px; 
        }
        .sticker-card { 
            background: white; border: 1px solid var(--border); border-radius: 8px;
            padding: 12px 5px; text-align: center; cursor: pointer; transition: all 0.2s;
            user-select: none; position: relative; overflow: hidden;
        }
        .sticker-card:active { transform: scale(0.95); }
        .sticker-card.status-si { background: var(--have-bg); border-color: #48bb78; }
        
        .s-id { font-weight: 800; font-size: 1.1rem; color: var(--fifa-maroon); display: block; }
        .s-desc { font-size: 0.65rem; color: #4a5568; margin-top: 5px; font-weight: 600; text-transform: uppercase; }
        .s-group { font-size: 0.55rem; color: #a0aec0; margin-top: 3px; }

        /* Badge for Escudo/Squad */
        .badge {
            position: absolute; top: 0; right: 0; background: var(--fifa-gold);
            color: white; font-size: 0.5rem; padding: 2px 5px; border-bottom-left-radius: 5px;
        }

        @media (max-width: 600px) {
            .dashboard { grid-template-columns: repeat(2, 1fr); }
            .search-box { grid-template-columns: 1fr; }
            .items-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <h2>🏆 CONTROL 2026</h2>
            <input type="text" id="usernameField" placeholder="Nombre de Usuario">
            <input type="password" id="passwordField" placeholder="Contraseña">
            <button onclick="loginUser()">INGRESAR AL ÁLBUM</button>
            <p style="margin-top:15px; font-size:0.8rem; color:#666;">Los datos se guardan localmente en este navegador.</p>
        </div>
    </div>

    <div class="app-container" id="appContainer">
        <header>
            <div>
                <h1>PANINI MUNDIAL 2026</h1>
                <small id="userDisplay" style="color: var(--fifa-gold); font-weight: bold;"></small>
            </div>
            <button onclick="location.reload()" style="background:rgba(255,255,255,0.2); border:none; color:white; padding:8px 15px; border-radius:8px; cursor:pointer;">Cerrar Sesión</button>
        </header>

        <div class="dashboard">
            <div class="kpi"><span id="kpiTotal">0</span><label>Total</label></div>
            <div class="kpi"><span id="kpiTengo">0</span><label>Tengo</label></div>
            <div class="kpi"><span id="kpiFaltan">0</span><label>Faltan</label></div>
            <div class="kpi"><span id="kpiProgreso">0%</span><label>Logro</label></div>
        </div>

        <div class="search-box">
            <input type="text" id="searchBar" placeholder="Buscar por código o país..." oninput="renderGrid()">
            <select id="groupFilter" onchange="renderGrid()">
                <option value="ALL">Todas las Secciones</option>
            </select>
            <select id="statusFilter" onchange="renderGrid()">
                <option value="ALL">Si y No</option>
                <option value="SI">Tengo</option>
                <option value="NO">Faltan</option>
            </select>
        </div>

        <div class="items-grid" id="stickersGrid"></div>
    </div>

    <script>
        // Lista exacta de 48 países según tu requerimiento (añadidos Venezuela e Irak para completar 48)
        const LISTA_PAISES = [
            { n: "Canadá", c: "CAN" }, { n: "Estados Unidos", c: "USA" }, { n: "México", c: "MEX" },
            { n: "Argentina", c: "ARG" }, { n: "Brasil", c: "BRA" }, { n: "Colombia", c: "COL" },
            { n: "Ecuador", c: "ECU" }, { n: "Paraguay", c: "PAR" }, { n: "Uruguay", c: "URU" },
            { n: "Alemania", c: "GER" }, { n: "Austria", c: "AUT" }, { n: "Bélgica", c: "BEL" },
            { n: "Bosnia y Herzegovina", c: "BIH" }, { n: "Croacia", c: "CRO" }, { n: "Escocia", c: "SCO" },
            { n: "España", c: "ESP" }, { n: "Francia", c: "FRA" }, { n: "Inglaterra", c: "ENG" },
            { n: "Noruega", c: "NOR" }, { n: "Países Bajos", c: "NED" }, { n: "Portugal", c: "POR" },
            { n: "República Checa", c: "CZE" }, { n: "Suecia", c: "SWE" }, { n: "Suiza", c: "SUI" },
            { n: "Turquía", c: "TUR" }, { n: "Curazao", c: "CUW" }, { n: "Haití", c: "HAI" },
            { n: "Panamá", c: "PAN" }, { n: "Argelia", c: "ALG" }, { n: "Cabo Verde", c: "CPV" },
            { n: "Costa de Marfil", c: "CIV" }, { n: "Egipto", c: "EGY" }, { n: "Ghana", c: "GHA" },
            { n: "Marruecos", c: "MAR" }, { n: "Senegal", c: "SEN" }, { n: "Sudáfrica", c: "RSA" },
            { n: "Túnez", c: "TUN" }, { n: "Arabia Saudita", c: "KSA" }, { n: "Australia", c: "AUS" },
            { n: "Corea del Sur", c: "KOR" }, { n: "Emiratos Árabes", c: "UAE" }, { n: "Irán", c: "IRN" },
            { n: "Japón", c: "JPN" }, { n: "Jordania", c: "JOR" }, { n: "Uzbekistán", c: "UZB" },
            { n: "Nueva Zelanda", c: "NZL" }, { n: "Venezuela", c: "VEN" }, { n: "Irak", c: "IRQ" }
        ].sort((a, b) => a.n.localeCompare(b.n));

        const STICKERS_BASE = [];

        // 1. FWC (00 + 1-19) = 20 estampas
        for (let i = 0; i <= 19; i++) {
            let label = i === 0 ? "00" : i;
            STICKERS_BASE.push({ id: `FWC ${label}`, desc: (i==0 || i==19) ? "Especial FWC" : "FIFA Historico", grupo: "FWC" });
        }

        // 2. Equipos (48 países * 20 estampas) = 960 estampas
        LISTA_PAISES.forEach(p => {
            for (let i = 1; i <= 20; i++) {
                let d = `Jugador ${i}`;
                let tag = "";
                if(i === 1) { d = "Escudo"; tag = "ESCUDO"; }
                if(i === 13) { d = "Equipo"; tag = "SQUAD"; }
                STICKERS_BASE.push({ id: `${p.c} ${i}`, desc: d, grupo: p.n, tag: tag });
            }
        });

        // 3. Coca Cola = 14 estampas
        for (let i = 1; i <= 14; i++) {
            STICKERS_BASE.push({ id: `CC ${i}`, desc: "Coca-Cola Especial", grupo: "COCA-COLA" });
        }

        // TOTAL: 20 + 960 + 14 = 994

        let userProgress = JSON.parse(localStorage.getItem("panini_db_2026")) || {};
        let currentUser = null;

        function loginUser() {
            const u = document.getElementById("usernameField").value.trim().toUpperCase();
            if(!u) return alert("Ingresa un usuario");
            currentUser = u;
            if(!userProgress[currentUser]) userProgress[currentUser] = {};
            
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("appContainer").style.display = "block";
            document.getElementById("userDisplay").textContent = "USUARIO: " + currentUser;
            
            poblarFiltroGrupos();
            renderGrid();
        }

        function poblarFiltroGrupos() {
            const select = document.getElementById("groupFilter");
            const grupos = [...new Set(STICKERS_BASE.map(s => s.grupo))];
            grupos.forEach(g => {
                const opt = document.createElement("option");
                opt.value = g; opt.textContent = g;
                select.appendChild(opt);
            });
        }

        function toggleSticker(id, element) {
            const actual = userProgress[currentUser][id] || "NO";
            const nuevo = actual === "SI" ? "NO" : "SI";
            userProgress[currentUser][id] = nuevo;
            
            if(nuevo === "SI") element.classList.add("status-si");
            else element.classList.remove("status-si");
            
            localStorage.setItem("panini_db_2026", JSON.stringify(userProgress));
            actualizarKPIs();
        }

        function actualizarKPIs() {
            const total = STICKERS_BASE.length;
            let tengo = 0;
            STICKERS_BASE.forEach(s => {
                if(userProgress[currentUser][s.id] === "SI") tengo++;
            });

            document.getElementById("kpiTotal").textContent = total;
            document.getElementById("kpiTengo").textContent = tengo;
            document.getElementById("kpiFaltan").textContent = total - tengo;
            document.getElementById("kpiProgreso").textContent = Math.round((tengo/total)*100) + "%";
        }

        function renderGrid() {
            const grid = document.getElementById("stickersGrid");
            const busqueda = document.getElementById("searchBar").value.toLowerCase();
            const filtroG = document.getElementById("groupFilter").value;
            const filtroS = document.getElementById("statusFilter").value;
            
            grid.innerHTML = "";
            const fragmento = document.createDocumentFragment();

            STICKERS_BASE.forEach(s => {
                const status = userProgress[currentUser][s.id] || "NO";
                
                // Filtros
                if(filtroG !== "ALL" && s.grupo !== filtroG) return;
                if(filtroS !== "ALL" && status !== filtroS) return;
                if(busqueda && !s.id.toLowerCase().includes(busqueda) && !s.grupo.toLowerCase().includes(busqueda)) return;

                const card = document.createElement("div");
                card.className = `sticker-card ${status === 'SI' ? 'status-si' : ''}`;
                card.onclick = () => toggleSticker(s.id, card);
                
                let badgeHTML = s.tag ? `<div class="badge">${s.tag}</div>` : "";
                
                card.innerHTML = `
                    ${badgeHTML}
                    <span class="s-id">${s.id}</span>
                    <span class="s-desc">${s.desc}</span>
                    <span class="s-group">${s.grupo}</span>
                `;
                fragmento.appendChild(card);
            });
            
            grid.appendChild(fragmento);
            actualizarKPIs();
        }
    </script>
</body>
</html>
