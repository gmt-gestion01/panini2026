    <meta charset="UTF-8">

    <title>GMT QA SYSTEM - Control Panini Mundial 2026</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #319795;
            --bg-light: #f7fafc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --border-color: #e2e8f0;
            --have-color: #c6f6d5;
            --have-text: #22543d;
            --miss-color: #fed7d7;
            --miss-text: #742a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* PANTALLA DE LOGIN (INICIO DE SESIÓN) */
        .login-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-card h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .login-card p {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 10pt;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 11pt;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: var(--primary-color);
        }

        /* CONTENEDOR PRINCIPAL DE LA APP */
        .app-container {
            display: none; 
            padding: 20px;
            flex-grow: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 { font-size: 1.5rem; }
        header p { font-size: 0.85rem; opacity: 0.9; }

        .logout-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* DASHBOARD Y FILTROS */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .kpi-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .kpi-card .value { font-size: 1.6rem; font-weight: bold; color: var(--primary-color); }
        .kpi-card .label { font-size: 0.85rem; color: #718096; text-transform: uppercase; font-weight: 600; }

        .filter-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .filter-group { flex: 1; min-width: 200px; }

        select {
            width: 100%; padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px; font-size: 10pt; outline: none;
        }

        /* CUADRÍCULA DE CROMOS */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .sticker-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100px;
        }

        .sticker-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.04); }
        .sticker-id { font-weight: bold; font-size: 1.1rem; color: var(--primary-color); }
        .sticker-desc { font-size: 0.75rem; color: #4a5568; margin-bottom: 6px; }
        .sticker-type { font-size: 0.65rem; background-color: #edf2f7; padding: 2px 6px; border-radius: 4px; font-weight: 600; color: #4a5568; }

        .sticker-card.status-si { background-color: var(--have-color) !important; border-color: #9ae6b4 !important; }
        .sticker-card.status-si .sticker-id, .sticker-card.status-si .sticker-desc, .sticker-card.status-si .sticker-type { color: var(--have-text) !important; }
        .sticker-card.status-si .sticker-type { background-color: rgba(255,255,255,0.4); }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background-color: #2d3748; color: white;
            padding: 12px 24px; border-radius: 6px; display: none; z-index: 10000; font-size: 0.9rem;
        }
    </style>
</head>

    <div class="login-screen" id="loginScreen">

            <div class="form-group">
                <label for="usernameField">Nombre o Apodo:</label>
                <input type="text" id="usernameField" placeholder="Ej: Carlos_QA">
            </div>
            
            <div class="form-group">
                <label for="passwordField">Contraseña:</label>

            </div>

        </div>
    </div>

                <div class="value" id="kpiProgreso" style="color: #2b6cb0;">0%</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-group">
                <input type="text" id="searchBar" style="width:100%; padding:10px 14px; border:1px solid var(--border-color); border-radius:6px;" placeholder="Buscar por código o descripción..." oninput="filterStickers()">

            <div class="filter-group" style="max-width: 250px;">

                    <option value="NO">Me faltan</option>
                </select>
            </div>
        </div>

        <div class="items-grid" id="stickersGrid"></div>
    </div>

        let userProgress = {};
        let userPasswords = {}; 
        let currentUser = null;

        window.onload = function() {
            loadStorage();
            buildGroupFilter();
            document.getElementById("usernameField").focus();
        };

        function loadStorage() {
            const savedProgress = localStorage.getItem("gmt_panini_progress");
            const savedPasswords = localStorage.getItem("gmt_panini_passwords");
            
            if(savedProgress) userProgress = JSON.parse(savedProgress);
            if(savedPasswords) userPasswords = JSON.parse(savedPasswords);
        }

        function saveStorage() {
            localStorage.setItem("gmt_panini_progress", JSON.stringify(userProgress));
            localStorage.setItem("gmt_panini_passwords", JSON.stringify(userPasswords));
        }

        function buildGroupFilter() {
            const filter = document.getElementById("groupFilter");
            const distinctGroups = [...new Set(STICKERS_BASE.map(s => s.grupo))];
            
            distinctGroups.forEach(g => {
                const opt = document.createElement("option");
                opt.value = g;
                opt.textContent = `Sección: ${g}`;
                filter.appendChild(opt);
            });
        }

        function handleAuth() {
            const userInp = document.getElementById("usernameField").value.trim();
            const passInp = document.getElementById("passwordField").value.trim();

            if (!userInp || !passInp) {
                alert("❌ Ingresa un nombre de usuario y contraseña para acceder.");
                return;
            }

            // Validar si el usuario ya existe
            if (userProgress[userInp] !== undefined) {
                if (userPasswords[userInp] === passInp) {
                    executeLogin(userInp);
                } else {
                    alert("❌ Contraseña incorrecta para este perfil.");
                }
            } else {
                // Registrar nuevo de forma limpia
                userProgress[userInp] = {};
                userPasswords[userInp] = passInp;
                saveStorage();
                alert(`✨ ¡Perfil "${userInp}" creado con éxito!`);
                executeLogin(userInp);
            }
        }

        function executeLogin(username) {
            currentUser = username;
            
            // Transición de interfaz
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("appContainer").style.display = "block";
            document.getElementById("sessionUserLabel").textContent = currentUser;
            
            // Limpiar inputs
            document.getElementById("usernameField").value = "";
            document.getElementById("passwordField").value = "";

            renderGrid();
            calculateMetrics();
            showToast();
        }

        function logout() {
            currentUser = null;
            document.getElementById("appContainer").style.display = "none";
            document.getElementById("loginScreen").style.display = "flex";
            document.getElementById("usernameField").focus();
        }

        function toggleSticker(id, cardElement) {
            if(!currentUser || !userProgress[currentUser]) return;

            const currentStatus = userProgress[currentUser][id] || "NO";
            const newStatus = currentStatus === "SI" ? "NO" : "SI";
            
            userProgress[currentUser][id] = newStatus;
            cardElement.className = `sticker-card status-${newStatus.toLowerCase()}`;
            
            saveStorage();
            calculateMetrics();
        }

        function calculateMetrics() {
            const total = STICKERS_BASE.length;
            const currentMap = userProgress[currentUser] || {};
            
            let tengo = 0;
            STICKERS_BASE.forEach(s => {
                if (currentMap[s.id] === "SI") tengo++;
            });

            const faltan = total - tengo;
            const porcentaje = total > 0 ? ((tengo / total) * 100).toFixed(1) : 0;

            document.getElementById("kpiTotal").textContent = total;
            document.getElementById("kpiTengo").textContent = tengo;
            document.getElementById("kpiFaltan").textContent = faltan;
            document.getElementById("kpiProgreso").textContent = `${porcentaje}%`;
        }

        function renderGrid() {
            const grid = document.getElementById("stickersGrid");
            grid.innerHTML = "";

            const query = document.getElementById("searchBar").value.toLowerCase().trim();
            const groupSel = document.getElementById("groupFilter").value;
            const statusSel = document.getElementById("statusFilter").value;

            const currentMap = userProgress[currentUser] || {};

            STICKERS_BASE.forEach(s => {
                const status = currentMap[s.id] || "NO";

                if(query && !s.id.toLowerCase().includes(query) && !s.desc.toLowerCase().includes(query)) return;
                if(groupSel !== "ALL" && s.grupo !== groupSel) return;
                if(statusSel !== "ALL" && status !== statusSel) return;

                const card = document.createElement("div");
                card.className = `sticker-card status-${status.toLowerCase()}`;
                card.onclick = () => toggleSticker(s.id, card);

                card.innerHTML = `
                    <div class="sticker-id">${s.id}</div>
                    <div class="sticker-desc">${s.desc}</div>
                    <div class="sticker-type">${s.tipo}</div>
                `;

                grid.appendChild(card);
            });
        }

        function filterStickers() {
            renderGrid();
        }

        function showToast() {
            const toast = document.getElementById("toastMessage");
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 1500);
        }
